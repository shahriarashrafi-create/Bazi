name: Android Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract module ZIPs
        shell: bash
        run: |
          set -e

          mkdir -p extracted-modules

          if [ -d "modules" ]; then
            shopt -s nullglob
            for zip in modules/*.zip; do
              echo "Extracting $zip"
              unzip -o "$zip" -d .
            done
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HeroLife-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
